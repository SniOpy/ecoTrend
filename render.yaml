services:
  - type: web
    name: ecotrend-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd back && npm install
    startCommand: cd back && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: ecotrend-backend
          property: port
      - key: DATABASE_URL
        fromDatabase:
          name: ecotrend-db
          property: connectionString
      - key: SECRET_KEY
        sync: false

databases:
  - name: ecotrend-db
    databaseName: ecotrend
    user: ecotrend_user
    plan: free
    region: frankfurt
